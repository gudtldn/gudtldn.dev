<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1117">
    <link rel="canonical" href="https://gudtldn.dev" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
    <link rel="manifest" href="/favicons/site.webmanifest">
    <!-- 크롤러/링크 미리보기는 JS를 실행하지 않으므로 정적 값을 둔다. (로드 후 updateMeta()가 profile.json 기준으로 갱신) -->
    <title>Siwoo Hyong | gudtldn.dev</title>
    <meta name="description" content="C++, 그래픽스 프로그래밍에 대해서 공부하고 있는 학생 개발자 입니다. 단순히 돌아가는 코드보다 그 이면의 원리와 아키텍처를 고민하고, 배운 것을 기록으로 남기는 것을 좋아합니다.">
    <meta property="og:title" content="Siwoo Hyong | gudtldn.dev">
    <meta property="og:description" content="C++, 그래픽스 프로그래밍에 대해서 공부하고 있는 학생 개발자 입니다. 단순히 돌아가는 코드보다 그 이면의 원리와 아키텍처를 고민하고, 배운 것을 기록으로 남기는 것을 좋아합니다.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gudtldn.dev">
    <meta property="og:site_name" content="gudtldn.dev">
    <meta property="og:locale" content="ko_KR">
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/style.css">

    <script src="/assets/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body x-data="profileApp" class="bg-[#0d1117] text-slate-200 min-h-screen transition-colors duration-300" x-cloak>

    <!-- Loading State -->
    <div x-show="!loaded && !error" class="max-w-4xl mx-auto px-5 py-12 md:py-24 space-y-12">
        <div class="space-y-4">
            <div class="h-12 w-48 skeleton rounded-lg"></div>
            <div class="h-6 w-full max-w-lg skeleton rounded-md"></div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="h-24 skeleton rounded-2xl"></div>
            <div class="h-24 skeleton rounded-2xl"></div>
            <div class="h-24 skeleton rounded-2xl"></div>
            <div class="h-24 skeleton rounded-2xl"></div>
        </div>
    </div>

    <!-- 에러 발생 시 보여줄 화면 -->
    <div class="max-w-4xl mx-auto px-5 py-32 text-center" x-show="error && loaded" x-cloak>
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-900/30 text-red-500 mb-6">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        </div>
        <h2 class="text-2xl font-bold mb-2">Something went wrong</h2>
        <p class="text-slate-300">profile.json 파일을 불러올 수 없습니다.<br>데이터 파일이 경로에 존재하는지 확인해 주세요.</p>
    </div>

    <!-- 정상 데이터 로드 시 보여줄 화면 -->
    <div class="max-w-4xl mx-auto px-5 py-12 md:py-24" x-show="!error && loaded" x-transition.opacity.duration.500ms>
        <!-- Header -->
        <header class="mb-12 md:mb-16">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                <h1 class="text-4xl md:text-5xl font-bold tracking-tight text-white" x-text="data.name"></h1>
                
                <div class="flex flex-col items-start md:items-end gap-2 mt-2 md:mt-0">
                    <div class="flex items-center gap-1.5 text-xs font-medium text-slate-300">
                        <template x-if="data.location">
                            <div class="flex items-center gap-1">
                                <svg class="w-3.5 h-3.5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.243-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                <span x-text="data.location"></span>
                                <span class="mx-1 opacity-50">•</span>
                            </div>
                        </template>
                        <!-- 현재 시간 정보 -->
                        <div class="flex items-center gap-1">
                            <svg class="w-3.5 h-3.5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <span x-text="currentTime" class="font-mono tracking-tighter"></span>
                        </div>
                    </div>

                    <div class="flex flex-wrap items-center gap-2">
                        <template x-for="badge in (Array.isArray(data.status) ? data.status : [data.status].filter(Boolean))" :key="badge">
                            <span class="px-2.5 py-0.5 text-[11px] font-medium uppercase tracking-wider rounded-md bg-blue-900/30 text-blue-300" x-text="badge"></span>
                        </template>
                        <!-- START: Military Status Badge -->
                        <template x-if="militaryInfo && militaryInfo.state !== 'post'">
                            <span class="px-2.5 py-0.5 text-[11px] font-medium uppercase tracking-wider rounded-md"
                                  :class="militaryInfo.state === 'pre' ? 'bg-amber-900/30 text-amber-300' : 'bg-emerald-900/30 text-emerald-300'"
                                  x-text="militaryInfo.badgeText"></span>
                        </template>
                        <!-- END: Military Status Badge -->
                    </div>
                </div>
            </div>
            
            <p class="text-base md:text-lg text-slate-300 leading-relaxed mb-8 max-w-2xl" x-html="data.bio"></p>
            
            <div class="flex flex-wrap items-center gap-y-4 gap-x-6 pt-2">
                <template x-for="social in data.socials" :key="social.platform">
                    <div class="flex items-center">
                        <template x-if="social.platform !== 'Discord'">
                            <a :href="social.url" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 text-sm font-medium text-slate-200 hover:text-blue-500 transition-colors py-1">
                                <template x-if="social.platform === 'GitHub'">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                                </template>
                                <template x-if="social.platform === 'Email'">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                                </template>
                                <template x-if="social.platform !== 'GitHub' && social.platform !== 'Email'">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                                </template>
                                <span x-text="social.platform"></span>
                            </a>
                        </template>
                        <template x-if="social.platform === 'Discord'">
                            <div class="relative cursor-pointer flex items-center gap-2 text-sm font-medium text-slate-200 hover:text-blue-500 transition-colors py-1" @click="copyDiscord(social.id)" title="Click to copy Discord ID">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037 19.736 19.736 0 0 0-4.885 1.515.069.069 0 0 0-.032.027C.533 9.048-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                                <span class="text-slate-300" x-text="social.id"></span>
                                <span x-show="copied" x-transition class="absolute -top-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-[10px] font-bold px-3 py-1.5 rounded-lg shadow-xl z-50">Copied!</span>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Blog 링크 뱃지 -->
                <template x-if="data.blogUrl">
                    <a :href="data.blogUrl" target="_blank" rel="noopener noreferrer" class="flex items-center gap-1.5 text-sm font-medium text-slate-200 hover:text-blue-500 transition-colors py-1 pl-4 border-l border-slate-800">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 17L17 7M7 7h10v10"></path></svg>
                        <span>Blog</span>
                    </a>
                </template>
            </div>
            
            <!-- START: Military Service Bio Block -->
            <template x-if="militaryInfo">
                <div class="glass p-4 rounded-2xl border border-white/5 w-full mt-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <!-- Left: Status & D-day -->
                    <div class="flex items-center gap-3 shrink-0 text-xs">
                        <span class="w-1.5 h-1.5 rounded-full transition-colors duration-300"
                              :style="`background-color: ${militaryInfo.color}; box-shadow: 0 0 6px ${militaryInfo.color};`"></span>
                        <span class="font-medium text-slate-300">육군 • <span x-text="militaryInfo.cardTitle"></span></span>
                        <span class="font-semibold text-white text-sm" x-text="militaryInfo.dday"></span>
                    </div>
                    
                    <!-- Middle: Stretching Progress Bar -->
                    <div class="flex-1 min-w-[120px] py-1">
                        <div class="w-full bg-slate-950 rounded-full h-1.5 overflow-hidden border border-slate-900/60">
                            <div class="h-full rounded-full transition-all duration-1000 ease-out"
                                 :style="`width: ${militaryInfo.state === 'pre' ? 0 : militaryInfo.percent}%; background-color: ${militaryInfo.color}; box-shadow: 0 0 8px ${militaryInfo.color};`"></div>
                        </div>
                    </div>
                    
                    <!-- Right: Percent & Dates -->
                    <div class="flex items-center gap-4 justify-between sm:justify-end text-xs text-slate-400 shrink-0">
                        <span x-text="militaryInfo.state === 'pre' ? '대기 중 (0%)' : (militaryInfo.state === 'post' ? '전역 완료 (100%)' : `${militaryInfo.percent}%`)" class="font-medium"></span>
                        <span class="font-medium text-slate-500">2026.06.08 ~ 2027.12.07</span>
                    </div>
                </div>
            </template>
            <!-- END: Military Service Bio Block -->
        </header>

        <main class="space-y-12 md:space-y-20">
            <!-- Currently Focusing -->
            <section x-show="data.currentlyFocusing && data.currentlyFocusing.length > 0">
                <h2 class="text-[11px] font-semibold uppercase tracking-[0.2em] text-slate-400 mb-6 flex items-center gap-3">
                    <span class="w-1.5 h-1.5 bg-blue-500 rounded-full shadow-[0_0_8px_rgba(59,130,246,0.5)]"></span>
                    Currently Focusing
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                    <template x-for="focus in data.currentlyFocusing" :key="focus.item">
                        <div class="glass p-4 rounded-2xl border-l-4 border-blue-500/30">
                            <span class="block text-[10px] text-slate-400 mb-1 font-medium uppercase tracking-wider" x-text="focus.category"></span>
                            <span class="font-medium text-sm" x-text="focus.item"></span>
                        </div>
                    </template>
                </div>
            </section>

            <!-- Projects -->
            <section x-show="data.projects && data.projects.length > 0">
                <h2 class="text-[11px] font-semibold uppercase tracking-[0.2em] text-slate-400 mb-6 flex items-center gap-3">
                    <span class="w-1.5 h-1.5 bg-blue-500 rounded-full shadow-[0_0_8px_rgba(59,130,246,0.5)]"></span>
                    Projects
                </h2>
                <div class="grid grid-cols-1 gap-4" :class="isSingleProject ? 'md:grid-cols-1' : 'md:grid-cols-2'">
                    <template x-for="project in sortedProjects" :key="project.key">
                        <article class="glass rounded-2xl overflow-hidden flex flex-col" :class="isSingleProject ? 'md:flex-row' : ''">
                            <!-- 썸네일: 이미지가 없으면 그라데이션 대체. 위에 페이드/틴트/테두리 오버레이를 겹침 -->
                            <div class="relative w-full aspect-video shrink-0 overflow-hidden bg-slate-900"
                                 :class="isSingleProject ? 'md:w-[55%] md:aspect-auto md:min-h-[18rem]' : ''">
                                <template x-if="project.image">
                                    <img :src="project.image" :alt="project.title" loading="lazy" class="absolute inset-0 w-full h-full object-cover">
                                </template>
                                <template x-if="!project.image">
                                    <div class="absolute inset-0 bg-gradient-to-br from-blue-500/20 via-slate-800/40 to-slate-900/60" aria-hidden="true"></div>
                                </template>
                                <div class="absolute inset-0 pointer-events-none" aria-hidden="true">
                                    <div class="absolute inset-0 bg-gradient-to-br from-blue-500/10 via-transparent to-transparent"></div>
                                    <div class="absolute inset-0 bg-gradient-to-t from-[#14181e] via-[#14181e]/30 to-transparent"
                                         :class="isSingleProject ? 'md:bg-gradient-to-r md:from-transparent md:via-transparent md:to-[#14181e]' : ''"></div>
                                    <div class="absolute inset-0 ring-1 ring-inset ring-white/5"></div>
                                </div>
                            </div>
                            <div class="p-5 flex flex-col flex-1 gap-3" :class="isSingleProject ? 'md:p-8 md:justify-center' : ''">
                                <div class="flex items-start justify-between gap-3">
                                    <h3 class="font-semibold text-base text-white" :class="isSingleProject ? 'md:text-xl' : ''" x-text="project.title"></h3>
                                    <template x-if="project.status">
                                        <span class="shrink-0 px-2 py-0.5 text-[10px] font-medium uppercase tracking-wider rounded-md"
                                              :class="project.statusActive ? 'bg-emerald-900/30 text-emerald-300' : 'bg-white/5 text-slate-400'"
                                              x-text="project.status"></span>
                                    </template>
                                </div>
                                <template x-if="project.summary">
                                    <p class="text-sm text-slate-300" x-text="project.summary"></p>
                                </template>
                                <template x-if="project.description">
                                    <p class="text-xs text-slate-400 leading-relaxed" x-text="project.description"></p>
                                </template>
                                <template x-if="project.tags && project.tags.length > 0">
                                    <div class="flex flex-wrap gap-1.5">
                                        <template x-for="tag in project.tags" :key="tag">
                                            <span class="px-2 py-0.5 text-[10px] font-medium rounded-md bg-white/5 text-slate-300" x-text="tag"></span>
                                        </template>
                                    </div>
                                </template>
                                <template x-if="project.links && project.links.length > 0">
                                    <div class="flex flex-wrap items-center gap-x-4 gap-y-2 mt-auto pt-2">
                                        <template x-for="link in project.links" :key="link.url">
                                            <a :href="link.url" target="_blank" rel="noopener noreferrer" class="flex items-center gap-1 text-xs font-medium text-slate-300 hover:text-blue-500 transition-colors">
                                                <span x-text="projectLinkLabel(link)"></span>
                                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 17L17 7M7 7h10v10"></path></svg>
                                            </a>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </article>
                    </template>
                </div>
            </section>

            <!-- Discovery & Links -->
            <template x-if="data.customLinks && data.customLinks.length > 0">
                <section>
                    <h2 class="text-[11px] font-semibold uppercase tracking-[0.2em] text-slate-400 mb-6">Discovery & Links</h2>
                    <div class="grid grid-cols-1 gap-3">
                        <template x-for="link in data.customLinks" :key="link.title">
                            <a :href="link.url" target="_blank" rel="noopener noreferrer" class="group flex items-center justify-between p-5 glass rounded-2xl touch-active transition-all hover:bg-white/5">
                                <div class="flex-1">
                                    <span class="block font-medium text-base mb-1 group-hover:text-blue-500 transition-colors" x-text="link.title"></span>
                                    <span class="text-xs text-slate-400 line-clamp-1" x-text="link.description"></span>
                                </div>
                                <div class="w-10 h-10 flex items-center justify-center rounded-full bg-white/5 text-slate-400 group-hover:text-blue-500 transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                                </div>
                            </a>
                        </template>
                    </div>
                </section>
            </template>

            <!-- Tech Stack -->
            <section x-show="data.techStack && (data.techStack.languages.length > 0 || data.techStack.tools.length > 0)">
                <h2 class="text-[11px] font-semibold uppercase tracking-[0.2em] text-slate-400 mb-6">Tech Stack</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                    <div class="space-y-6" x-show="data.techStack.languages.length > 0">
                        <h3 class="text-[11px] font-semibold text-slate-400 mb-4 uppercase flex items-center gap-2">
                            <span class="w-1 h-3 bg-slate-700 rounded-full"></span>
                            Languages
                        </h3>
                        <div class="flex flex-wrap gap-x-6 gap-y-6">
                            <template x-for="lang in data.techStack.languages" :key="lang.name">
                                <a :href="lang.url" target="_blank" rel="noopener noreferrer" class="flex flex-col items-center gap-2 group cursor-pointer active:scale-90 transition-transform">
                                    <img :src="`https://skillicons.dev/icons?i=${lang.logo}`" :alt="lang.name" class="h-10 w-10 md:h-12 md:w-12 transition-all duration-300 group-hover:scale-110 group-hover:-translate-y-1">
                                    <span class="text-[10px] font-bold text-slate-400 group-hover:text-blue-500 transition-colors" x-text="lang.name"></span>
                                </a>
                            </template>
                        </div>
                    </div>
                    <div class="space-y-6" x-show="data.techStack.tools.length > 0">
                        <h3 class="text-[11px] font-semibold text-slate-400 mb-4 uppercase flex items-center gap-2">
                            <span class="w-1 h-3 bg-slate-700 rounded-full"></span>
                            Tools & Engines
                        </h3>
                        <div class="flex flex-wrap gap-x-6 gap-y-6">
                            <template x-for="tool in data.techStack.tools" :key="tool.name">
                                <a :href="tool.url" target="_blank" rel="noopener noreferrer" class="flex flex-col items-center gap-2 group cursor-pointer active:scale-90 transition-transform">
                                    <img :src="`https://skillicons.dev/icons?i=${tool.logo}`" :alt="tool.name" class="h-10 w-10 md:h-12 md:w-12 transition-all duration-300 group-hover:scale-110 group-hover:-translate-y-1">
                                    <span class="text-[10px] font-bold text-slate-400 group-hover:text-blue-500 transition-colors" x-text="tool.name"></span>
                                </a>
                            </template>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Infrastructure -->
            <section x-show="data.infrastructure && data.infrastructure.length > 0">
                <h2 class="text-[11px] font-semibold uppercase tracking-[0.2em] text-slate-400 mb-6">Infrastructure</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <template x-for="infra in data.infrastructure" :key="infra.name">
                        <a :href="infra.url" target="_blank" rel="noopener noreferrer" class="group flex items-center justify-between p-5 glass rounded-2xl touch-active transition-all hover:bg-white/5">
                            <div class="flex items-center gap-4">
                                <div :class="`w-12 h-12 rounded-xl flex items-center justify-center bg-${infra.theme}-500/10 text-${infra.theme}-500`">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                                </div>
                                <div>
                                    <span class="block font-medium text-base" x-text="infra.name"></span>
                                    <span class="text-xs text-slate-400" x-text="infra.description"></span>
                                </div>
                            </div>
                            <svg class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-all transform translate-x-[-10px] group-hover:translate-x-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                        </a>
                    </template>
                </div>
            </section>

            <!-- Activity & Stats -->
            <section x-show="data.github.username" class="pt-12 border-t border-slate-800">
                <h2 class="text-[11px] font-semibold uppercase tracking-[0.2em] text-slate-400 mb-10 text-center">Activity & Performance</h2>
                <div class="flex flex-col gap-10">
                    <div class="flex flex-col md:flex-row items-center justify-center gap-6">
                        <div class="w-full md:w-auto flex justify-center">
                            <img :src="`https://github-readme-stats-gudtldn.vercel.app/api?username=${data.github.username}&bg_color=00000000&hide_border=true&show_icons=true&include_all_commits=true&count_private=true&text_color=7e8c9a&icon_color=${data.github.themeColor}&title_color=ffffff&card_width=380`" alt="GitHub Stats" class="max-w-full">
                        </div>
                        <div class="w-full md:w-auto flex justify-center">
                            <img :src="`https://github-readme-stats-gudtldn.vercel.app/api/top-langs?username=${data.github.username}&bg_color=00000000&hide_border=true&langs_count=10&exclude_repo=${data.github.username}.github.io,github-readme-stats,gudtldn.dev,ProgrammingClass_PPT&layout=compact&text_color=7e8c9a&icon_color=${data.github.themeColor}&title_color=ffffff&card_width=320`" alt="Top Languages" class="max-w-full">
                        </div>
                    </div>
                    <div class="w-full flex flex-col items-center gap-4">
                        <h3 class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest">Commit Contribution</h3>
                        <div class="w-full max-w-2xl overflow-x-auto pb-4 scrollbar-hide">
                            <div class="min-w-[600px] md:min-w-0">
                                <img :src="`https://ghchart.rshah.org/${data.github.themeColor}/${data.github.username}`" alt="GitHub Contributions Chart" class="w-full opacity-90">
                            </div>
                        </div>
                    </div>

                    <!-- START: GitHub Recent Commits Feed -->
                    <div class="w-full">
                        <!-- 스켈레톤 로딩 -->
                        <div x-show="data.github.username && !commitsLoaded" class="w-full flex flex-col gap-3">
                            <div class="flex items-center gap-3">
                                <div class="h-2.5 w-28 skeleton rounded-full"></div>
                                <div class="flex-1 h-px bg-slate-800/60"></div>
                                <div class="h-2.5 w-8 skeleton rounded-full"></div>
                            </div>
                            <template x-for="i in [0, 1, 2]" :key="i">
                                <div :style="`margin-left: ${i * 20}px; max-width: calc(100% - ${i * 20}px);`">
                                    <div class="p-4 glass rounded-xl">
                                        <div class="flex items-center gap-3">
                                            <div class="w-1.5 h-1.5 rounded-full skeleton shrink-0"></div>
                                            <div class="flex-1 space-y-2">
                                                <div class="h-3 skeleton rounded-md" :style="`width: ${90 - i * 15}%;`"></div>
                                                <div class="h-2.5 w-40 skeleton rounded-md"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- 커밋 카드 (데이터 있을 때만 표시) -->
                        <div x-show="commitsLoaded && recentCommits.length > 0" class="w-full flex flex-col gap-3">
                            <!-- 섹션 헤더 -->
                            <div class="flex items-center gap-3">
                                <h3 class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest shrink-0">Recent Commits</h3>
                                <div class="flex-1 h-px bg-slate-800"></div>
                            </div>
                            <!-- 커밋 카드 목록 -->
                            <template x-for="(commit, index) in recentCommits" :key="commit.sha">
                                <div :style="commitCardStyle(index)">
                                    <a :href="commit.url" target="_blank" rel="noopener noreferrer"
                                       class="group flex items-start gap-3 p-4 glass rounded-xl hover:bg-white/5 transition-colors touch-active">
                                        <span class="mt-[5px] w-1.5 h-1.5 rounded-full bg-emerald-500 shrink-0"
                                              :style="`opacity: ${[1, 0.7, 0.4][index]};`"></span>
                                        <div class="flex-1 min-w-0">
                                            <p class="text-sm font-medium text-slate-200 truncate group-hover:text-blue-400 transition-colors"
                                               x-text="commit.message"></p>
                                            <div class="flex items-center gap-2 mt-1.5 flex-wrap">
                                                <span class="text-[11px] text-slate-500 font-medium"
                                                      x-text="commit.repo.split('/')[1] || commit.repo"></span>
                                                <span class="text-slate-700 text-xs">·</span>
                                                <code class="font-mono text-[11px] text-slate-600 bg-slate-800/50 px-1.5 py-0.5 rounded"
                                                      x-text="commit.sha"></code>
                                                <span class="text-slate-700 text-xs">·</span>
                                                <span class="text-[11px] text-slate-500"
                                                      x-text="relativeTime(commit.date)"></span>
                                            </div>
                                        </div>
                                        <svg class="w-3.5 h-3.5 text-slate-700 group-hover:text-blue-400 transition-colors shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                                    </a>
                                </div>
                            </template>
                        </div>
                    </div>
                    <!-- END: GitHub Recent Commits Feed -->
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="mt-24 pb-12 text-center">
            <div class="inline-flex items-center gap-2 mb-6 px-4 py-2 glass rounded-2xl shadow-sm">
                 <img :src="`https://komarev.com/ghpvc/?username=${data.github.username}&label=Page%20Views&color=blue&style=flat-square`" alt="Page Views" class="h-4">
            </div>
            <p class="text-[10px] text-slate-500 font-medium tracking-[0.2em] uppercase">
                &copy; <span x-text="new Date().getFullYear()"></span> <span x-text="data.name"></span> • <span x-text="data.domain"></span>
            </p>
        </footer>
    </div>
</body>
</html>
